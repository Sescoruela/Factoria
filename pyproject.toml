[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factoria"
version = "0.1.0"
description = "Extensible development-flow factory for agent-assisted software delivery."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sergi Escoruela" }]
dependencies = []

[project.scripts]
factoria = "factoria.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"factoria.adapters" = ["capabilities.toml"]
