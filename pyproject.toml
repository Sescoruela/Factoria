[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factoria"
version = "0.3.0"
description = "Extensible development-flow factory for agent-assisted software delivery."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sergi Escoruela" }]
dependencies = []

[project.scripts]
factoria = "factoria.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"factoria" = ["release.toml"]
"factoria.adapters" = ["capabilities.toml"]
"factoria.web" = ["*.html", "*.js", "*.css"]

[project.optional-dependencies]
dev = ["ruff==0.14.4"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F821", "F823"]
