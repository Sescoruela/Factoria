name: Windows installer

on:
  push:
    paths:
      - "src/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "src/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools pyinstaller
          python -m pip install -e .

      - name: Read package version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "FACTORIA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building Factoria $version"

      - name: Build standalone executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name Factoria `
            --copy-metadata factoria `
            --collect-data factoria.adapters `
            --collect-data factoria.web `
            packaging/windows/factoria_launcher.py

      - name: Smoke test standalone executable
        shell: pwsh
        run: |
          $output = & .\dist\Factoria.exe --version
          Write-Host $output
          if ($output -ne "factoria $env:FACTORIA_VERSION") {
            throw "Unexpected version output: $output"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "/DMyAppVersion=$env:FACTORIA_VERSION" "packaging\windows\Factoria.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test installer
        shell: pwsh
        run: |
          $installer = "dist\installer\Factoria-Setup-$env:FACTORIA_VERSION.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "FactoriaInstalled"
          & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS="" /DIR="$installDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = & (Join-Path $installDir "Factoria.exe") --version
          Write-Host $output
          if ($output -ne "factoria $env:FACTORIA_VERSION") {
            throw "Installed executable returned unexpected version: $output"
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Factoria-Windows-${{ env.FACTORIA_VERSION }}
          if-no-files-found: error
          path: |
            dist/Factoria.exe
            dist/installer/Factoria-Setup-${{ env.FACTORIA_VERSION }}.exe
